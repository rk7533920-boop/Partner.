name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Sync web files and plugins
        run: npx cap sync android
      - name: Add screen-time plugin
        run: |
          D=android/app/src/main/java/com/partner/diary
          mkdir -p $D
          cp UsageStatsPlugin.java MainActivity.java $D/
      - name: Add lock-screen and assistant support
        run: |
          D=android/app/src/main/java/com/partner/diary
          cp QuickPlugin.java PartnerAssistService.java PartnerSessionService.java PartnerRecognitionService.java $D/
          mkdir -p android/app/src/main/res/xml
          cp assist_service.xml android/app/src/main/res/xml/assist_service.xml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:showWhenLocked="true" android:turnScreenOn="true"#' $M
          sed -i 's#</application>#<service android:name="com.partner.diary.PartnerAssistService" android:permission="android.permission.BIND_VOICE_INTERACTION" android:exported="true"><meta-data android:name="android.voice_interaction" android:resource="@xml/assist_service"/><intent-filter><action android:name="android.service.voice.VoiceInteractionService"/></intent-filter></service><service android:name="com.partner.diary.PartnerSessionService" android:permission="android.permission.BIND_VOICE_INTERACTION" android:exported="true"/><service android:name="com.partner.diary.PartnerRecognitionService" android:label="Partner" android:exported="true"><intent-filter><action android:name="android.speech.RecognitionService"/><category android:name="android.intent.category.DEFAULT"/></intent-filter></service></application>#' $M
      - name: Add spoken reminders
        run: |
          D=android/app/src/main/java/com/partner/diary
          cp SpeakerPlugin.java SpeakReceiver.java SpeakService.java SpeakBootReceiver.java $D/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<receiver android:name="com.partner.diary.SpeakReceiver" android:exported="false"/><receiver android:name="com.partner.diary.SpeakBootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver><service android:name="com.partner.diary.SpeakService" android:exported="false" android:foregroundServiceType="mediaPlayback"/></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/><uses-permission android:name="android.permission.WAKE_LOCK"/></manifest>#' $M
      - name: Add alarms, calendar and lockdown
        run: |
          D=android/app/src/main/java/com/partner/diary
          cp PhonePlugin.java LockdownPlugin.java LockdownService.java PartnerAdminReceiver.java $D/
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cp lockdown_service.xml device_admin.xml android/app/src/main/res/xml/
          cp lockdown_strings.xml android/app/src/main/res/values/lockdown_strings.xml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<service android:name="com.partner.diary.LockdownService" android:exported="false" android:label="Partner lockdown" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/lockdown_service"/></service><receiver android:name="com.partner.diary.PartnerAdminReceiver" android:exported="true" android:permission="android.permission.BIND_DEVICE_ADMIN"><meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin"/><intent-filter><action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/></intent-filter></receiver></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="com.android.alarm.permission.SET_ALARM"/><uses-permission android:name="android.permission.READ_CALENDAR"/><uses-permission android:name="android.permission.WRITE_CALENDAR"/></manifest>#' $M
      - name: Allow speech engines on Android 11+
        run: |
          sed -i 's#</manifest>#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent><intent><action android:name="android.speech.RecognitionService"/></intent></queries></manifest>#' android/app/src/main/AndroidManifest.xml
          grep -c queries android/app/src/main/AndroidManifest.xml
      - name: Allow notifications and alarms
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"/><uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Add Hey Partner (wake word)
        run: |
          set -e
          D=android/app/src/main/java/com/partner/diary
          cp HotwordService.java HotwordPlugin.java $D/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<service android:name="com.partner.diary.HotwordService" android:exported="false" android:foregroundServiceType="microphone"/></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/><uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/></manifest>#' $M
          B=android/app/build.gradle
          sed -i '/^dependencies {/a implementation "com.alphacephei:vosk-android:0.3.47"' $B
          sed -i '/^dependencies {/a implementation "net.java.dev.jna:jna:5.13.0@aar"' $B
          sed -i 's#defaultConfig {#defaultConfig { ndk { abiFilters "arm64-v8a", "armeabi-v7a" }#' $B
          grep -q "vosk-android" $B
          grep -q "jna:5.13.0" $B
          grep -q "abiFilters" $B
          grep -q "HotwordService" $M
      - name: Download the offline wake-word model
        run: |
          set -e
          mkdir -p vosk_tmp
          curl -L -f --retry 5 --retry-delay 5 -o vosk_tmp/m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip || curl -L -f --retry 5 --retry-delay 5 -o vosk_tmp/m.zip https://huggingface.co/grimso/vosk-models/resolve/main/vosk-model-small-en-us-0.15.zip
          unzip -q vosk_tmp/m.zip -d vosk_tmp
          A=android/app/src/main/assets
          mkdir -p $A
          mv vosk_tmp/vosk-model-small-en-us-0.15 $A/vosk-model
          test -f $A/vosk-model/am/final.mdl
          ls $A/vosk-model
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Partner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
