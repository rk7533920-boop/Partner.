<style>

<div id="warn"></div><div id="top"></div><main id="main"></main><div id="foot"></div><div id="sheet"></div>
<input type="file" id="file" accept="application/json" hidden>
<script>
const $=s=>document.querySelector(s),NP=(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())?Capacitor.Plugins:null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),dayK=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const t12=t=>new Date(t).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}).toUpperCase();

const D={set:{key:'',goal:'Gain 10 kg in 3 months',cal:3000,pro:120,tone:'gentle',notif:true,mute:0,rev:'22:00',lastBackup:0,revAsked:'',autoMic:false,lockBtn:false,model:'claude-haiku-5-5'},mem:[],entries:[],sleep:[],usage:[],targets:[],chat:[],fu:[],ana:null,notes:[]};
let S=JSON.parse(JSON.stringify(D)),db,busy=false,typing=false,V='diary',vd=0,ED='',memBusy=false,LIST=[],TREF=[],RREF=[],QK=false,QR='',FQ=false,PV='',stOpen=false,TG={open:false,off:0,t:'',n:'',u:''};
const TONE={gentle:'warm, encouraging, never shaming',strict:'firm and direct, short sentences, expects discipline',brutal:'brutally honest, no sugar-coating, never insulting his worth'};
const ICON={gym:'#c27ae0',meal:'#d4a85a',study:'#6fbf9b',phone:'#e5645f'},DONE=['done','meal','study','gym','phone','other'];
const US=NP&&NP.UsageStats;
const MN={'claude-haiku-5-5':'Haiku 5.5','claude-sonnet-5-5':'Sonnet 5.5','claude-opus-5-5':'Opus 5.5'},CM=()=>S.set.model||'claude-haiku-5-5';
const isSt=b=>/ypt|yeolpumta/i.test((b.a||'')+' '+(b.p||'')),AC=b=>(S.set.appCol&&S.set.appCol[b.p])||(isSt(b)?BC.Study:BC.Phone);
const DE=/(din|दिन)\s*(khatam|khtm|खत्म|खतम|poora|pura|पूरा|over|end)|good\s*night|गुड\s*नाइट|day\s*(over|end)/i;
const DURK=['meal','study','gym','phone','done','other'];
const CK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const SECS=['Goals','What I want to become','Personal facts','Current habits','Preferences','How I talk','AI discovered patterns'];
const BC={Sleep:'#7aa2d6',Eating:'#d4a85a',Phone:'#e5645f',Gym:'#c27ae0',Study:'#6fbf9b',Other:'#5fb7d4',Unlogged:'#6e6e6e'};
const MIC='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const KB='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>';
const GEAR='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>';
const BACK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>';
const UP='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';

/* ---------- storage (IndexedDB) ---------- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('partner',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const dbGet=k=>new Promise((ok,no)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const dbPut=(k,v)=>new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error)});
function warn(m){const w=$('#warn');w.textContent=m;w.style.display='block'}
$('#warn').onclick=()=>$('#warn').style.display='none';
async function put(k){if(QK)return;try{await dbPut(k,S[k])}catch(e){warn(e&&e.name==='QuotaExceededError'?'Storage is full, data was not saved. Export a backup from Settings > Backup and free up space.':'Could not save data: '+((e&&e.message)||e))}}
async function migrate(){try{const o=JSON.parse(localStorage.getItem('saathi_v1')||'null');if(!o)return;
 S.entries=(o.entries||[]).map(e=>({id:String(e.id),ts:e.ts,kind:e.kind==='sleep'?'other':e.kind,text:e.text,dur:0,cal:e.cal||0,p:e.p||0,c:e.c||0,f:e.f||0,why:e.why||''}));
 S.notes=o.notes||[];if(o.set){S.set.key=o.set.key||'';S.set.goal=o.set.goal||S.set.goal;S.set.cal=+o.set.cal||3000;S.set.pro=+o.set.pro||120;S.set.tone=o.set.tone||'gentle'}
 for(const k of['set','entries','notes'])await put(k)}catch(e){}}
async function checkQuick(){if(!NP||!NP.Quick||!NP.Quick.consume)return;
 try{const r=await NP.Quick.consume();if(r&&r.pending){FQ=true;if(V!=='chat'||typing){V='chat';typing=false;render()}if(!cv.on)startC()}}catch(e){}}
async function inboxPush(it){return new Promise((ok,no)=>{const t=db.transaction('kv','readwrite'),st=t.objectStore('kv'),g=st.get('inbox');g.onsuccess=()=>{st.put((g.result||[]).concat([it]),'inbox')};t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error)})}
async function mergeInbox(){if(QK||!db)return;
 try{const inb=await new Promise((ok,no)=>{const t=db.transaction('kv','readwrite'),st=t.objectStore('kv'),g=st.get('inbox');g.onsuccess=()=>{st.put([],'inbox');ok(g.result||[])};t.onerror=t.onabort=()=>no(t.error)});
  if(!inb.length)return;
  inb.forEach(it=>{S.entries.push(...(it.entries||[]));(it.sleep||[]).forEach(x=>{if(x[0]==='bed')bedAt(x[1]);else{wakeAt(x[1],x[2]);resolveFu('wake')}});(it.targets||[]).forEach(t=>{if(!S.targets.some(x=>x.status==='open'&&x.date===t.date&&norm(x.text)===norm(t.text)))S.targets.push(t)})});
  await Promise.all([put('entries'),put('sleep'),put('targets'),put('fu')]);for(const it of inb)if(it.said)await judgeFu(it.said,it.reply||'',0);syncN();render()}catch(e){}}
async function boot(){
 if(NP&&NP.Quick){try{QK=!!(await NP.Quick.mode()).quick}catch(e){}}
 try{db=await idb();for(const k of Object.keys(D)){if(QK&&k!=='set'&&k!=='sleep')continue;const v=await dbGet(k);if(v!==undefined&&v!==null)S[k]=k==='set'?{...D.set,...v}:v}
  if(!QK&&!S.entries.length&&!S.chat.length)await migrate();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
 catch(e){warn('Could not open storage. Data will be lost after this session. ('+((e&&e.message)||e)+')')}
 if(QK){render();startC();return}
 await mergeInbox();migSleep();if(S.set.goal&&!S.set.goalDone){if(!S.mem.some(m=>m.sec==='Goals'))addMem('Goals',S.set.goal,false);S.set.goalDone=true;put('mem');put('set')}render();autoStart();checkQuick();if(NP&&NP.Quick&&NP.Quick.addListener)NP.Quick.addListener('quick',checkQuick);checkDue();syncN();syncUsage();if(S.set.lockBtn&&NP&&NP.Quick)NP.Quick.setEnabled({enabled:true}).catch(()=>{});setInterval(checkDue,15000);
 if(!NP&&'serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------- derived data ---------- */
const isNight=x=>{if(!x.end)return false;if(x.night!==undefined)return !!x.night;const h=new Date(x.start||x.end).getHours();return x.start?(x.end-x.start>=144e5&&(h>=21||h<7)):h<11};
const dayStart=ts=>{let b=0;for(const x of S.sleep)if(x.end&&x.end<=ts&&x.end>b&&isNight(x))b=x.end;if(b&&ts-b<30*36e5)return b;const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
function bedAt(ts){const o=S.sleep.find(x=>!x.end);if(o&&Math.abs(o.start-ts)<36e5)return;S.sleep=S.sleep.filter(x=>x.end);S.sleep.push({id:'s'+ts,start:ts,end:null,wd:''})}
function dayEndHit(x){const d=S.set.dayEndAt;if(d&&x.end>d&&x.end-d<72e5*10){x.night=true;S.set.dayEndAt=0;put('set')}}
function wakeAt(ts,m){const o=S.sleep.find(x=>!x.end);
 if(o){if(ts>o.start){o.end=ts;o.wd=dayK(ts);dayEndHit(o)}return}
 const l=S.sleep.filter(x=>x.end).sort((a,b)=>b.end-a.end)[0];if(l&&ts-l.end<108e5)return;
 {const n={id:'s'+ts,start:m?ts-m*6e4:null,end:ts,wd:dayK(ts)};dayEndHit(n);S.sleep.push(n)}}
function migSleep(){const x=S.entries.filter(e=>e.kind==='bed'||e.kind==='wake').sort((a,b)=>a.ts-b.ts);if(!x.length)return;
 x.forEach(e=>e.kind==='bed'?bedAt(e.ts):wakeAt(e.ts,0));S.entries=S.entries.filter(e=>e.kind!=='bed'&&e.kind!=='wake');put('sleep');put('entries')}
function diaryText(cut){const rows=[],lbl=ts=>new Date(dayStart(ts)).toLocaleDateString('en-IN',{day:'numeric',month:'short'}),uds=new Set(S.usage.filter(b=>b.s>cut).map(b=>lbl(b.s)));
 S.entries.filter(e=>e.ts>cut&&!(e.kind==='phone'&&uds.has(lbl(e.ts)))).forEach(e=>rows.push([e.ts-(e.dur||0)*6e4,e.ts,'['+e.kind+'] '+e.text+(e.dur?' | '+e.dur+' min':'')+(e.cal?' | '+e.cal+' kcal P'+e.p:'')+(e.why?' | why: '+e.why:'')]));
 const ut={};
 S.usage.filter(b=>b.s>cut).forEach(b=>{const k=lbl(b.s);(ut[k]=ut[k]||[]).push(b);if(b.e-b.s>=6e5)rows.push([b.s,b.s,'['+(isSt(b)?'study':'phone')+'] '+b.a+' | '+Math.round((b.e-b.s)/6e4)+' min'])});
 S.sleep.filter(x=>(x.end||x.start)>cut).forEach(x=>rows.push([x.start||x.end,x.start||x.end,'[sleep] '+(x.start?t12(x.start):'?')+' to '+(x.end?t12(x.end):'ongoing')+(x.start&&x.end?' | '+dur(Math.round((x.end-x.start)/6e4)):'')+(x.end?' | woke '+new Date(x.end).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'')]));
 S.targets.forEach(t=>{const ts=new Date(t.date+'T12:00:00').getTime();if(ts>cut)rows.push([ts,ts,'[target] '+t.text+' | '+(t.status==='done'?'done':t.status==='dropped'?'dropped':t.date<dayK(dayStart(Date.now()))?'not done':'open')+(t.goal?' | '+t.done+'/'+t.goal+' '+(t.unit||''):t.pct?' | '+t.pct+'%':'')+(t.why?' | why not: '+t.why:'')])});
 rows.sort((a,b)=>a[0]-b[0]);let out='',last='';
 rows.forEach(r=>{const k=new Date(dayStart(r[1])).toLocaleDateString('en-IN',{day:'numeric',month:'short'});if(k!==last){const q=ut[k]?usageSum(ut[k]):null;out+=(out?'\n\n':'')+'## Day starting '+k+(q?' | screen time '+dur(q.t)+' (top: '+q.top.map(a=>a[0]+' '+dur(a[1])).join(', ')+')':'')+'\n';last=k}out+=t12(r[0])+' '+r[2]+'\n'});
 return out.trim()}
const norm=t=>String(t).toLowerCase().replace(/[^a-z0-9\u0900-\u097f]/g,'');
function addMem(sec,t,ai){t=String(t||'').trim().slice(0,300);if(!t)return false;sec=SECS.includes(sec)?sec:'Personal facts';const k=norm(t);
 if(S.mem.some(m=>{const o=norm(m.t);return o===k||(k.length>12&&o.length>12&&(o.includes(k)||k.includes(o)))}))return false;
 S.mem.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,5),t,sec,ai:!!ai,ts:Date.now()});
 const same=S.mem.filter(m=>m.ai&&m.sec===sec);if(same.length>12)S.mem=S.mem.filter(m=>m!==same[0]);return true}
function memText(){let out='';SECS.forEach(sec=>{const it=S.mem.filter(m=>(m.sec||'Personal facts')===sec).slice(-8);if(it.length)out+=sec+': '+it.map(m=>m.t).join('; ')+'\n'});return out.slice(0,2500).trim()||'(none)'}
async function classify(t){
 const j=pj(await ask(`Split the note into separate short facts about the user and assign each to exactly one section: ${SECS.join(' | ')}. Keep his wording style (Roman Hinglish or English), never Devanagari. Write each fact in plain third person, like "Wants to gain 10 kg in 3 months". Output ONLY JSON {"items":[{"sec":"","t":""}]}.`,[{role:'user',content:t}],'claude-haiku-5-5',800));
 let n=0;(j.items||[]).forEach(x=>{if(addMem(x.sec,x.t,false))n++});if(!n)throw new Error('Already in memory, or could not understand it.')}
const usageIn=(st,en)=>S.usage.filter(b=>b.e>st&&b.s<en).map(b=>({...b,s:Math.max(b.s,st),e:Math.min(b.e,en)}));
function usageSum(bl,n){const m={};let t=0;bl.forEach(b=>{const d=(b.e-b.s)/6e4;t+=d;m[b.a]=(m[b.a]||0)+d});return{t:Math.round(t),top:Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n||5).map(([a,d])=>[a,Math.round(d)])}}
async function syncUsage(){if(!US)return;
 try{const g=await US.hasAccess();S.set.usAccess=g.granted;if(!g.granted)return;
  const now=Date.now(),from=S.set.usSync?Math.max(S.set.usSync-30*6e4,now-7*864e5):now-7*864e5;
  const r=await US.getSessions({start:from,end:now});
  const ss=(r.sessions||[]).filter(x=>!/launcher|systemui|com\.partner\.diary/i.test(x.p)).sort((a,b)=>a.s-b.s),bl=[];
  ss.forEach(x=>{const l=bl[bl.length-1];if(l&&l.p===x.p&&x.s-l.e<=12e4)l.e=Math.max(l.e,x.e);else bl.push({p:x.p,a:x.a,s:x.s,e:x.e})});
  S.usage=S.usage.filter(b=>b.e<=from).concat(bl.filter(b=>b.e-b.s>=6e4)).filter(b=>b.e>now-30*864e5);
  S.set.usSync=now;await put('usage');await put('set');if(V==='diary')render()}
 catch(e){warn('Screen time sync failed: '+((e&&e.message)||e))}}
async function usCheck(){const el=$('#usst');if(!el)return;

<p class="lab">Step 2  ·  Save the analysis from Claude</p><textarea class="f" id="pn" placeholder="Paste the reply from Claude"></textarea><button class="pb" data-a="savenote">Save analysis</button>`;

 $('#main').innerHTML=`<div style="min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:0 8px"><div style="font-size:19px;font-weight:600">Partner</div><div style="font-size:18px;line-height:1.5;min-height:56px;max-width:300px">${esc(busy?'...':QR)}</div><button id="mic" data-a="mic" aria-label="Tap to talk">${MIC}</button><div class="cap" id="cap"></div><div style="display:flex;gap:10px"><button class="pill" data-a="qopen">Open full app</button><button class="pill" data-a="qclose">Close</button></div><small>The phone is locked, so saved information is not shown here.</small></div>`;uiMic()}
function render(){if(QK)return renderQuick();const keep=typing&&$('#in')?$('#in').value:'';$('#top').innerHTML=topBar();$('#main').innerHTML=main();$('#foot').innerHTML=foot();
 if(V==='chat'){$('#main').scrollTop=1e9;if(typing&&$('#in')){$('#in').value=keep;$('#in').focus()}uiMic()}if(V==='s-us')usCheck()}

/* ---------- actions ---------- */
function buildReport(d){const cut=Date.now()-d*864e5,data=diaryText(cut)||'(no entries)';
 const n=S.notes.length?'\nMy previous review notes (check if I followed them):\n'+S.notes[S.notes.length-1].text+'\n':'';
 return `You are my mentor and accountability partner "Partner". I am intelligent but undisciplined and want to change. Problem: late-night calls, bad sleep, ruined mornings, wasted days.
Targets: ${S.set.cal} kcal, ${S.set.pro} g protein/day. Tone: ${TONE[S.set.tone]}. Reply in Hinglish (Roman Hindi).
About me:\n${memText()}\n${n}
Analyse my diary (last ${d} days): 1) sleep, wake and morning pattern, 2) calories and protein vs target, 3) gym and study, and the real reasons for skipped tasks, 4) the 3 clearest patterns with evidence, 5) what I did wrong, 6) ONE or TWO concrete changes, 7) one honest sentence. Note: my day starts when I wake up, not at midnight; [sleep] lines are sleep sessions and belong to the day they started.
End with a summary of at most 120 words between ===SAVE=== and ===END=== that I will paste into my app.

DIARY\n${data}`}
async function copyT(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();return ok}}
async function analyse(){const b=$('#an');b.disabled=true;b.textContent='Soch raha hu...';
 try{const cut=Date.now()-7*864e5,data=diaryText(cut);
  if(!data)throw new Error('There is no data for the last 7 days.');
  const j=pj(await ask(`You are Partner, a mentor. Tone: ${TONE[S.set.tone]}. ${S.set.cal} kcal/day. About him: ${memText()}. Analyse the diary. Hinglish in Roman letters only. Output ONLY JSON {"patterns":[3 short items],"wrong":[up to 3 short items],"recs":[up to 3],"steps":[1 or 2 concrete steps]}.`,[{role:'user',content:data}],'claude-sonnet-5-5',2000));
  S.ana={ts:Date.now(),patterns:j.patterns||[],wrong:j.wrong||[],recs:j.recs||[],steps:j.steps||[]};await put('ana');S.ana.patterns.slice(0,3).forEach(p=>addMem('AI discovered patterns',p,true));await put('mem')}catch(e){warn(e.message)}render()}
async function doExport(){const txt=JSON.stringify({app:'partner',v:2,at:Date.now(),set:{...S.set,key:''},mem:S.mem,entries:S.entries,sleep:S.sleep,targets:S.targets,notes:S.notes,chat:S.chat.slice(-100)}),name='partner-backup-'+dayK(Date.now())+'.json';
 try{if(NP&&NP.Filesystem&&NP.Share){const w=await NP.Filesystem.writeFile({path:name,data:txt,directory:'CACHE',encoding:'utf8'});await NP.Share.share({title:'Partner backup',url:w.uri})}
  else{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click()}}}catch(e){return}
 S.set.lastBackup=Date.now();put('set');render()}
const A={
 go:v=>{if(cv.on&&v!=='chat')stopC();if(v==='diary')vd=0;if(v==='settings'&&V!=='settings'&&!SUB[V])PV=V;V=v;render()},tab:v=>{A.go(v);if(v==='chat'&&!typing&&!cv.on)startC()},stog:()=>{stOpen=!stOpen;render()},tgopen:()=>{tgSync();TG.open=!TG.open;render()},tgday:o=>{tgSync();TG.off=+o;render()},tgadd:()=>{tgSync();const t=TG.t.trim();if(!t)return;const b=new Date(dayStart(Date.now()));b.setDate(b.getDate()+TG.off);if(!applyT({act:'add',text:t,date:dayK(b),goal:+TG.n||0,unit:TG.u.trim()})){warn('This target already exists.');return}put('targets');TG={open:false,off:0,t:'',n:'',u:''};render()},usopen:()=>{US&&US.openSettings()},ussync:async()=>{await syncUsage();usCheck()},ttog:id=>{const t=S.targets.find(x=>x.id===id);if(!t)return;if(t.status==='done'){t.status='open';t.done=0;t.pct=0}else{t.status='done';t.doneTs=Date.now();if(t.goal)t.done=t.goal;t.pct=100}put('targets');render()},tdel:id=>{S.targets=S.targets.filter(x=>x.id!==id);put('targets');render()},lockbtn:async()=>{if(!NP||!NP.Quick){warn('This works only in the APK.');return}S.set.lockBtn=!S.set.lockBtn;try{if(S.set.lockBtn&&NP.LocalNotifications)await NP.LocalNotifications.requestPermissions();await NP.Quick.setEnabled({enabled:S.set.lockBtn})}catch(e){warn('Could not set the lock screen button: '+((e&&e.message)||e))}put('set');render()},qopen:()=>{NP&&NP.Quick&&NP.Quick.openMain()},qclose:()=>{FQ=false;NP&&NP.Quick&&NP.Quick.close()},amic:()=>{S.set.autoMic=!S.set.autoMic;put('set');render()},tvoice:()=>{V='chat';render();startC()},pday:d=>{vd+=+d;render()},
 mic:()=>cv.on?stopC():startC(),type:()=>{typing=true;render()},voice:()=>{typing=false;render()},
 sendt:()=>{const i=$('#in'),t=i.value;i.value='';send(t)},
 review:()=>{V='chat';render();send('Daily review')},analyse,
 addmem:async()=>{const i=$('#mn'),t=i.value.trim();if(!t||memBusy)return;memBusy=true;$('#ma').textContent='...';
  try{await classify(t)}catch(e){if(addMem('Personal facts',t,false))warn((e.message||'Could not sort it.')+' Added under Personal facts. Tap it to change the section.')}
  memBusy=false;await put('mem');render()},
 medit:id=>{ED=id;V='s-medit';render()},
 msave:()=>{const m=S.mem.find(x=>x.id===ED),t=$('#met').value.trim();if(m&&t){m.t=t;m.sec=$('#mse').value;m.ai=false;put('mem')}V='s-mem';render()},
 mdel:id=>{S.mem=S.mem.filter(m=>m.id!==id);put('mem');V='s-mem';render()},
 tone:k=>{S.set.tone=k;put('set');render()},
 ntog:()=>{S.set.notif=!S.set.notif;put('set');syncN();render()},
 nsp:()=>{S.set.nspeak=S.set.nspeak===false;put('set');syncN();render()},
 mute:h=>{S.set.mute=+h?Date.now()+h*36e5:0;put('set');syncN();render()},
 copyrep:async()=>{const ok=await copyT(buildReport(+$('#rd').value));$('#rm').textContent=ok?'Copied. Now paste it in the Claude app.':'Copy failed. Try Share.'},
 sharerep:async()=>{try{const t=buildReport(+$('#rd').value);NP&&NP.Share?await NP.Share.share({text:t}):await navigator.share({text:t})}catch(e){}},
 savenote:()=>{const r=$('#pn').value.trim();if(!r)return;const m=r.match(/===SAVE===([\s\S]*?)===END===/);S.notes.push({ts:Date.now(),text:(m?m[1]:r).trim().slice(0,2000)});put('notes');V='patterns';render()},
 exp:doExport,imp:()=>$('#file').click()};
const PAL=['#ff3b30','#ff9500','#ffd60a','#30d158','#00c7be','#0a84ff','#bf5af2','#ff2d92','#8e8e93'],PN=['Red','Orange','Yellow','Green','Teal','Blue','Purple','Pink','Grey'],cname=c=>PN[PAL.indexOf(c)]||'Default';
const dtl=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
let EDT=null;
function closeEdit(){EDT=null;$('#sheet').innerHTML=''}
function drawEdit(){const o=EDT;if(!o)return;const ro=o.k==='u',sl=o.k==='s';
 $('#sheet').innerHTML=`<div class="bd" data-a="eclose"></div><div class="sh"><p class="lab" style="margin:0 0 10px">${sl?'Sleep':ro?esc(o.name)+' (time comes from the phone)':'Edit entry'}</p>${o.k==='e'?`<input class="f" id="etx" value="${esc(o.tx)}">`:''}<div style="margin-top:10px"><small>${sl?'Bed time':'Start'}</small><input class="f" id="est" type="datetime-local" value="${o.s?dtl(o.s):''}" ${ro?'disabled':''}></div><div style="margin-top:10px"><small>${sl?'Wake time':'End'}</small><input class="f" id="een" type="datetime-local" value="${o.e?dtl(o.e):''}" ${ro?'disabled':''}></div><p class="lab" style="margin:16px 0 0">Color${ro?' (for this app)':''}:  <span id="cn" style="text-transform:none;letter-spacing:0;color:var(--tx);font-size:13px">${cname(o.c)}</span></p><div class="sw2">${PAL.map(c=>`<button class="cs ${c===o.c?'sel':''}" style="background:${c}" data-a="ecol" data-v="${c}" aria-label="Color"></button>`).join('')}</div><small id="eerr" style="display:block;margin-top:10px;color:#e5645f"></small><div class="two"><button class="pb" style="background:var(--s2);color:var(--tx)" data-a="eclose">Cancel</button><button class="pb" data-a="esave">Save</button></div></div>`}
A.eclose=closeEdit;A.etog=v=>{EXP.has(v)?EXP.delete(v):EXP.add(v);const m=$('#main'),y=m.scrollTop;render();m.scrollTop=y};
A.eopen=v=>{const [k,id,t]=v.split('|'),i=decodeURIComponent(id);
 if(k==='e'){const e=S.entries.find(x=>x.id===i);if(!e)return;const c=e.col||ICON[e.kind]||'#5fb7d4';EDT={k,id:i,tx:e.text,s:e.ts-(e.dur||0)*6e4,e:e.ts,c,c0:c}}
 else if(k==='s'){const x=S.sleep.find(y=>y.id===i);if(!x)return;const c=x.col||BC.Sleep;EDT={k,id:i,s:x.start,e:x.end,c,c0:c}}
 else if(k==='u'){const b=S.usage.find(y=>y.p===i&&y.s<=+t&&y.e>+t);if(!b)return;const c=AC(b);EDT={k,id:i,name:b.a,s:b.s,e:b.e,c,c0:c}}
 else return;drawEdit()};
A.ecol=c=>{if(!EDT)return;EDT.c=c;$('#cn').textContent=cname(c);document.querySelectorAll('#sheet .cs').forEach(b=>b.classList.toggle('sel',b.dataset.v===c))};
A.esave=()=>{const o=EDT;if(!o)return;const er=m=>{$('#eerr').textContent=m},pr=id=>{const v=$(id).value;return v?new Date(v).getTime():null};
 if(o.k==='u'){if(o.c!==o.c0){S.set.appCol={...(S.set.appCol||{}),[o.id]:o.c};put('set')}closeEdit();render();return}
 const s=pr('#est'),e=pr('#een');
 if(o.k==='e'){const x=S.entries.find(y=>y.id===o.id);if(!x){closeEdit();return}if(s===null||e===null)return er('Both start and end time are required.');if(e<s)return er('End time cannot be before start time.');
  const tx=$('#etx').value.trim();if(tx)x.text=tx;x.ts=e;x.dur=Math.min(1440,Math.round((e-s)/6e4));if(o.c!==o.c0)x.col=o.c;put('entries')}
 else{const x=S.sleep.find(y=>y.id===o.id);if(!x){closeEdit();return}if(s!==null&&e!==null&&e<=s)return er('Wake time must be after bed time.');if(x.end&&e===null)return er('Wake time cannot be empty.');
  x.start=s;x.end=e;x.wd=e?dayK(e):'';if(o.c!==o.c0)x.col=o.c;put('sleep')}
 closeEdit();render()};

 try{const j=JSON.parse(await f.text());if(j.app!=='partner')throw 0;const have=new Set(S.entries.map(x=>x.id));let n=0;(j.entries||[]).forEach(x=>{if(!have.has(x.id)){S.entries.push(x);n++}});
  const ht=new Set(S.targets.map(x=>x.id));(j.targets||[]).forEach(x=>{if(!ht.has(x.id))S.targets.push(x)});const hs=new Set(S.sleep.map(x=>x.id));(j.sleep||[]).forEach(x=>{if(!hs.has(x.id))S.sleep.push(x)});const hm=new Set(S.mem.map(x=>x.id));(j.mem||[]).forEach(x=>{if(!hm.has(x.id))S.mem.push(x)});const hn=new Set(S.notes.map(x=>x.ts));(j.notes||[]).forEach(x=>{if(!hn.has(x.ts))S.notes.push(x)});
  if(!S.chat.length)S.chat=j.chat||[];const keep=S.set.key;S.set={...S.set,...j.set,key:keep};
  await Promise.all(['set','mem','entries','sleep','targets','notes','chat'].map(put));render();warn(n+' new entries restored.')}catch(x){warn('This is not a valid Partner backup file.')}e.target.value=''};
