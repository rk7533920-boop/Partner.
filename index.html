const OVP=()=>NP&&NP.OfflineVoice,OFS={ok:null,voice:'',err:'',busy:0};

async function ofBlob(t){const P=OVP();if(!P)throw new Error('The offline voice is not in this build');

async function ggBlob(t){const nm=ggVoiceName(),lc=nm.split('-').slice(0,2).join('-');

 if(!r.ok){const m=await apiErrMsg(r);throw new Error('Google voice error '+r.status+(m?': '+m:''))}
 const j=await r.json(),bin=atob(j.audioContent||''),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:'audio/mpeg'})}

 return `# Context (this message is self-contained, you need no earlier chat)
I use a personal diary app called Partner. Below is my diary data exported from it. Act as my mentor and accountability partner and analyse ${lb}.
Reply in Hinglish (Roman Hindi), warm but honest, never guilt-tripping. Do not ask me questions first: analyse what is there and say what is missing.

# About me
Goal: ${S.set.goal}. Daily targets: ${S.set.cal} kcal and ${S.set.pro} g protein.
${S.set.idNow?'Who I am now: '+S.set.idNow+'\n':''}${S.set.idWant?'Who I want to become: '+S.set.idWant+'\n':''}Tone I prefer: ${TONE[S.set.tone]}.${S.set.custom?'\nMy own instructions: '+S.set.custom:''}
What the app knows about me:
${memText()||'(nothing yet)'}
Habits I am building (atomic-habits style: no streaks, small steps count):
${hab}
${n}
# How to read the data
- My day runs from waking up to the next waking up, not midnight. Each "## Day starting" header is one such day, with screen time and time by tag.
- Lines look like: TIME [kind] description | duration | tag. Kinds: done, meal, study, gym, phone, other, sleep, target, habit.
- [phone] and [study] lines that name an app are real phone usage (study = the YPT study timer app). [sleep] lines are sleep sessions and belong to the day they started.
- [target] lines are my tasks: done, not done (with the reason after "why not"), or open. [habit] lines are habits I completed that day. [gym] lines are exercises with weight, reps and sets, [weight] lines are body-weight check-ins.
- Times are 24-hour. Time with no entry is unlogged: treat it as unknown, not as wasted and not as zero. Each day header also gives the unlogged time, so you can see how complete that day is.
- "nutrition not logged" on a meal means calories are unknown, not zero. "no meals logged" in a day header means unknown, not that I fasted.
- The MESSAGES section at the end is everything I said to Partner (me) and its replies (P) in this period. Use it for context, mood and the reasons I gave.
- Tags are the activity categories I chose (Study, Work, Food, Sleep and so on).
- The SPENDING section lists my payments (money out only): day, time, amount in rupees, who or what, [my tag] and my own note. [Unsorted] means I have not tagged it yet: unknown, not bad. If a day has no payments, nothing was recorded, which is not proof that I spent nothing.

# What I want from you
1) Sleep, wake-up time and morning pattern. 2) Calories and protein versus target, and where my money went (SPENDING section, if it has data). 3) Study, work and gym time, and the real reasons behind skipped tasks. 4) My habits and how I am moving toward the identity I want. 5) The 3 clearest patterns, each with evidence from the data. 6) What went wrong, without blame. 7) ONE or TWO concrete changes for tomorrow. 8) One honest closing sentence.
Finish with a summary of at most 120 words between ===SAVE=== and ===END=== so I can paste it back into my app.

# DIARY (${d===1?'today':'last '+d+' days'})
${data}

# SPENDING (${d===1?'today':'last '+d+' days'})
${spAll().length?spBlock(cut+1,(rg&&rg.b)?rg.b:Infinity,d===1?'this day':'this period'):'(spending is not tracked yet)'}

# MESSAGES (${d===1?'today':'last '+d+' days'}, every message, me = my words, P = Partner)
${msgText(cut)}`}

const tH=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
function segsFor(st,en,es,ub,last){const now=Date.now(),sg=[];
 ub.forEach(b=>sg.push({a:b.s,b:b.e,k:isSt(b)?'Study':'Phone',w:1}));
 es.filter(e=>DONE.includes(e.kind)&&e.dur>0&&!PHN(e,ub)).forEach(e=>sg.push({a:e.ts-e.dur*6e4,b:e.ts,k:tagOf(e),w:1}));
 S.sleep.forEach(x=>{if(x.start>=st&&(last?x.start<=en:x.start<en))sg.push({a:x.start,b:Math.min(x.end||now,en),k:'Sleep',w:3})});
 if(last)S.open.forEach(o=>{const a=Math.max(o.ts,st);if(o.ts<now&&a<now)sg.push({a,b:now,k:tagOf(o),w:1})});
 /* sleep wins over everything; otherwise the one that started first wins */
 const cl=x=>Math.max(st,Math.min(en,x)),pts=[...new Set([st,en,...sg.flatMap(x=>[cl(x.a),cl(x.b)])])].sort((a,b)=>a-b),tot={};
 for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];if(b<=a)continue;let best=null;sg.forEach(x=>{if(x.a<=a&&x.b>=b&&(!best||x.w>best.w||(x.w===best.w&&x.a<best.a)))best=x});const k=best?best.k:'Unlogged';tot[k]=(tot[k]||0)+(b-a)/6e4}
 return tot}
const allDays=()=>[...new Set([...S.entries.map(e=>dayStart(e.ts)),...nightWakes(),dayStart(Date.now())])].sort((a,b)=>a-b);
function dayStat(ts){const st=dayStart(ts),ds=allDays(),i=Math.max(0,ds.indexOf(st)),last=i>=ds.length-1,en=last?Date.now():ds[i+1];
 const es=S.entries.filter(e=>e.ts>=st&&(last?true:e.ts<en)),ub=usageIn(st,en),tot=segsFor(st,en,es,ub,last);
 const meals=es.filter(e=>e.kind==='meal'),known=meals.filter(e=>e.cal>0),kc=meals.reduce((a,e)=>a+(e.cal||0),0),pr=meals.reduce((a,e)=>a+(e.p||0),0);
 const tg=Object.entries(tot).filter(([k,m])=>k!=='Unlogged'&&m>=1).sort((a,b)=>b[1]-a[1]).map(([k,m])=>k+' '+dur(Math.round(m))).join(', ');
 return ' | time by tag, same as the app: '+(tg||'nothing logged')+' | unlogged (unknown, not zero): '+dur(Math.round(tot.Unlogged||0))+' | '+(!meals.length?'no meals logged (unknown, not zero)':known.length?'meals: '+meals.length+', '+kc+' kcal, '+Math.round(pr)+' g protein'+(known.length<meals.length?', '+(meals.length-known.length)+' meal(s) without nutrition':''):meals.length+' meal(s) logged, nutrition not logged')}

 L.forEach(m=>{const k=new Date(dayStart(m.ts)).toLocaleDateString('en-IN',{day:'numeric',month:'short'});if(k!==last){out+=(out?'\n':'')+'## '+k+'\n';last=k}out+=tH(m.ts)+' '+(m.role==='user'?'me':'P')+': '+String(m.c).replace(/\s+/g,' ').trim()+'\n'});return out.trim()||'(no messages)'}
