name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # SHA-256 of Partner's signing key. If the key in use is different, the build stops here instead of making an APK that cannot update the installed app.
      EXPECTED_KEY_SHA256: e17a7b96668a6e242007bb33a17278a5054431a6135baa76aaafeea7300be1ac
    steps:
      - uses: actions/checkout@v4
      - name: Use fixed signing key
        env:
          KS_B64: ${{ secrets.PARTNER_KEYSTORE_B64 }}
        run: |
          set -e
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "Signing key: GitHub Secret"
          elif [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "Signing key: debug.keystore from the repo"
          else
            echo "No signing key found. Keep debug.keystore in the repo or set the secret PARTNER_KEYSTORE_B64."
            exit 1
          fi
          GOT=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Key fingerprint: $GOT"
          if [ "$GOT" != "$EXPECTED_KEY_SHA256" ]; then
            echo "This is not Partner's key. An APK signed with it would not install over the old app. Stopping."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          sed -i "s/const BUILD='dev';/const BUILD='${{ github.run_number }}';/" www/index.html
          grep -q "const BUILD='${{ github.run_number }}';" www/index.html
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Set app version (rises with every build, so the new APK installs over the old one)
        run: |
          set -e
          N=${{ github.run_number }}
          B=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.0.$N\"/" $B
          grep -n "versionCode\|versionName" $B
          grep -q "versionCode $N" $B
      - name: Sign with Partner's key (set explicitly, not left to the Android default)
        run: |
          set -e
          cp ~/.android/debug.keystore android/app/partner.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  partner {
                      storeFile file('partner.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.partner
                  }
              }
          }
          EOF
          tail -20 android/app/build.gradle
      - name: Sync web files and plugins
        run: npx cap sync android
      - name: Add screen-time plugin
        run: |
          D=android/app/src/main/java/com/partner/diary
          mkdir -p $D
          cp UsageStatsPlugin.java MainActivity.java $D/
      - name: Add lock-screen and assistant support
        run: |
          D=android/app/src/main/java/com/partner/diary
          cp QuickPlugin.java PartnerAssistService.java PartnerSessionService.java PartnerRecognitionService.java $D/
          mkdir -p android/app/src/main/res/xml
          cp assist_service.xml android/app/src/main/res/xml/assist_service.xml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:showWhenLocked="true" android:turnScreenOn="true"#' $M
          sed -i 's#</application>#<service android:name="com.partner.diary.PartnerAssistService" android:permission="android.permission.BIND_VOICE_INTERACTION" android:exported="true"><meta-data android:name="android.voice_interaction" android:resource="@xml/assist_service"/><intent-filter><action android:name="android.service.voice.VoiceInteractionService"/></intent-filter></service><service android:name="com.partner.diary.PartnerSessionService" android:permission="android.permission.BIND_VOICE_INTERACTION" android:exported="true"/><service android:name="com.partner.diary.PartnerRecognitionService" android:label="Partner" android:exported="true"><intent-filter><action android:name="android.speech.RecognitionService"/><category android:name="android.intent.category.DEFAULT"/></intent-filter></service></application>#' $M
      - name: Add spoken reminders
        run: |
          D=android/app/src/main/java/com/partner/diary
          cp SpeakerPlugin.java SpeakReceiver.java SpeakService.java SpeakBootReceiver.java $D/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<receiver android:name="com.partner.diary.SpeakReceiver" android:exported="false"/><receiver android:name="com.partner.diary.SpeakBootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver><service android:name="com.partner.diary.SpeakService" android:exported="false" android:foregroundServiceType="mediaPlayback"/></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/><uses-permission android:name="android.permission.WAKE_LOCK"/></manifest>#' $M
      - name: Add alarms, calendar and lockdown
        run: |
          D=android/app/src/main/java/com/partner/diary
          cp PhonePlugin.java LockdownPlugin.java LockdownService.java PartnerAdminReceiver.java LockdownAcc.java BankModeReceiver.java $D/
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cp lockdown_service.xml device_admin.xml android/app/src/main/res/xml/
          cp lockdown_strings.xml android/app/src/main/res/values/lockdown_strings.xml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<service android:name="com.partner.diary.LockdownService" android:exported="false" android:label="Partner lockdown" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/lockdown_service"/></service><receiver android:name="com.partner.diary.PartnerAdminReceiver" android:exported="true" android:permission="android.permission.BIND_DEVICE_ADMIN"><meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin"/><intent-filter><action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/></intent-filter></receiver></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="com.android.alarm.permission.SET_ALARM"/><uses-permission android:name="android.permission.READ_CALENDAR"/><uses-permission android:name="android.permission.WRITE_CALENDAR"/></manifest>#' $M
          sed -i 's#</application>#<receiver android:name="com.partner.diary.BankModeReceiver" android:exported="false"/></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/></manifest>#' $M
      - name: Add spending, night call rule and call screening
        run: |
          set -e
          D=android/app/src/main/java/com/partner/diary
          cp SpendPlugin.java NightRule.java NightCallScreen.java PartnerNotifListener.java $D/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<service android:name="com.partner.diary.NightCallScreen" android:exported="true" android:permission="android.permission.BIND_SCREENING_SERVICE"><intent-filter><action android:name="android.telecom.CallScreeningService"/></intent-filter></service><service android:name="com.partner.diary.PartnerNotifListener" android:exported="true" android:label="Partner" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"><intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter></service></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.READ_SMS"/><uses-permission android:name="android.permission.READ_CONTACTS"/><uses-permission android:name="android.permission.ANSWER_PHONE_CALLS"/><uses-permission android:name="android.permission.READ_PHONE_STATE"/></manifest>#' $M
          grep -q "NightCallScreen" $M
          grep -q "PartnerNotifListener" $M
          grep -q "READ_SMS" $M
      - name: Allow speech engines on Android 11+
        run: |
          sed -i 's#</manifest>#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent><intent><action android:name="android.speech.RecognitionService"/></intent></queries></manifest>#' android/app/src/main/AndroidManifest.xml
          grep -c queries android/app/src/main/AndroidManifest.xml
      - name: Allow notifications and alarms
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"/><uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Add Hey Partner (wake word)
        run: |
          set -e
          D=android/app/src/main/java/com/partner/diary
          cp HotwordService.java HotwordPlugin.java $D/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<service android:name="com.partner.diary.HotwordService" android:exported="false" android:foregroundServiceType="microphone"/></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/><uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/></manifest>#' $M
          B=android/app/build.gradle
          sed -i '/^dependencies {/a implementation "com.alphacephei:vosk-android:0.3.47"' $B
          sed -i '/^dependencies {/a implementation "net.java.dev.jna:jna:5.13.0@aar"' $B
          sed -i 's#defaultConfig {#defaultConfig { ndk { abiFilters "arm64-v8a", "armeabi-v7a" }#' $B
          grep -q "vosk-android" $B
          grep -q "jna:5.13.0" $B
          grep -q "abiFilters" $B
          grep -q "HotwordService" $M
      - name: Download the offline wake-word model
        run: |
          set -e
          mkdir -p vosk_tmp
          curl -L -f --retry 5 --retry-delay 5 -o vosk_tmp/m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip || curl -L -f --retry 5 --retry-delay 5 -o vosk_tmp/m.zip https://huggingface.co/grimso/vosk-models/resolve/main/vosk-model-small-en-us-0.15.zip
          unzip -q vosk_tmp/m.zip -d vosk_tmp
          A=android/app/src/main/assets
          mkdir -p $A
          mv vosk_tmp/vosk-model-small-en-us-0.15 $A/vosk-model
          test -f $A/vosk-model/am/final.mdl
          ls $A/vosk-model
          curl -L -f --retry 3 --retry-delay 5 -o vosk_tmp/in.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip && unzip -q vosk_tmp/in.zip -d vosk_tmp && mv vosk_tmp/vosk-model-small-en-in-0.4 $A/vosk-model-in || echo "Indian English model skipped"
          test -f $A/vosk-model-in/am/final.mdl || rm -rf $A/vosk-model-in
          ls $A
      - name: Add offline Hindi voice (Piper via sherpa-onnx)
        continue-on-error: true
        run: |
          set -e
          mkdir -p voice_tmp
          # 1) the sherpa-onnx Android library (first link that works)
          OK=0
          for U in \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.39/sherpa-onnx-1.12.39.aar \
            https://huggingface.co/csukuangfj/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.12.39.aar \
            https://huggingface.co/csukuangfj/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.10.35.aar; do
            if curl -L -f --retry 3 --retry-delay 5 -o voice_tmp/sherpa.aar "$U" && unzip -l voice_tmp/sherpa.aar | grep -q "libsherpa-onnx-jni.so"; then OK=1; echo "sherpa-onnx library from $U"; break; fi
          done
          test "$OK" = 1
          # 2) a Hindi Piper voice (first one that exists)
          BASE=https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models
          V=""
          for N in vits-piper-hi_IN-pratham-high vits-piper-hi_IN-pratham-medium vits-piper-hi_IN-priyamvada-medium vits-piper-hi_IN-rohan-medium; do
            if curl -L -f --retry 3 --retry-delay 5 -o voice_tmp/v.tar.bz2 "$BASE/$N.tar.bz2" && tar tjf voice_tmp/v.tar.bz2 | grep -q "tokens.txt"; then V=$N; echo "voice $N"; break; fi
          done
          test -n "$V"
          tar xjf voice_tmp/v.tar.bz2 -C voice_tmp
          test -f voice_tmp/$V/tokens.txt
          ls voice_tmp/$V/*.onnx
          if [ ! -d voice_tmp/$V/espeak-ng-data ]; then
            curl -L -f --retry 3 --retry-delay 5 -o voice_tmp/e.tar.bz2 $BASE/espeak-ng-data.tar.bz2
            tar xjf voice_tmp/e.tar.bz2 -C voice_tmp/$V
          fi
          test -d voice_tmp/$V/espeak-ng-data
          # 3) only now change the Android project, so a failed download leaves the build untouched
          A=android/app/src/main/assets
          mkdir -p $A android/app/libs
          rm -rf $A/hindi_voice
          mkdir -p $A/hindi_voice
          cp voice_tmp/$V/*.onnx voice_tmp/$V/tokens.txt $A/hindi_voice/
          cp -r voice_tmp/$V/espeak-ng-data $A/hindi_voice/espeak-ng-data
          echo "$V" > $A/hindi_voice/VOICE_NAME
          cp voice_tmp/sherpa.aar android/app/libs/sherpa-onnx.aar
          B=android/app/build.gradle
          sed -i '/^dependencies {/a implementation fileTree(dir: "libs", include: ["*.aar"])' $B
          sed -i '/^dependencies {/a implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"' $B
          grep -q "kotlin-stdlib" $B
          cp OfflineVoicePlugin.java android/app/src/main/java/com/partner/diary/
          echo "Offline voice added: $V"
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Check the APK (signing key and version)
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          GOT=$($BT/apksigner verify --print-certs $APK | grep "SHA-256 digest" | head -1 | sed 's/.*: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signed with: $GOT"
          test "$GOT" = "$EXPECTED_KEY_SHA256"
          $BT/aapt dump badging $APK | grep -m1 "^package:" || true
      - uses: actions/upload-artifact@v4
        with:
          name: Partner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
