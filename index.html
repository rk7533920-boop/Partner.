async function suOne(k){const x=SUS.find(y=>y[0]===k);if(!x)return;
 if(x[4]){SU.wait=k;setTimeout(()=>{if(SU.on&&SU.wait===k&&!document.hidden){SU.err=x[1]+': the Android page did not open. '+(k==='adm'?'Open Settings, Security, Device admin apps, Partner.':'');SU.wait=null;suRun()}},15000);

  return}

 while(SU.on){const st=await suStatus();if(V==='s-setup')render();

  if(!nx){SU.on=false;SU.wait=null;const miss=SUS.filter(x=>st[x[0]]===false).map(x=>x[1]);
   if(!miss.length){S.set.setupDone=true;put('set');SU.err='';if(V==='s-setup'&&SU.first){V='diary';maybeGoals()}toast('All set. Partner has every permission it needs.',0,3200)}
   else if(!SU.err&&!SU.one)SU.err=miss.join(', ')+' still off. Tap Allow next to it to try again.';

  SU.tried.add(nx[0]);await suOne(nx[0]);if(nx[4])return}}

function buildReport(d){const now=Date.now(),cut=d===1?dayStart(now)-1:now-d*864e5,data=diaryText(cut)||'(no entries)',lb=d===1?'today (my current day, from waking up until now)':'the last '+d+' days';

 const hab=S.habits.length?S.habits.map(h=>'- '+h.name+(h.ident?' (identity: I am someone who '+h.ident+')':'')+'; cue: '+(whenText(h)||'none')+(h.step?'; smallest step: '+h.step:'')+'; done on '+weekKeys().filter(k=>hl(h.id,k)>0).length+' of 7 days this week').join('\n'):'(none yet)';
 return `# Context (this message is self-contained, you need no earlier chat)
I use a personal diary app called Partner. Below is my diary data exported from it. Act as my mentor and accountability partner and analyse ${lb}.
Reply in Hinglish (Roman Hindi), warm but honest, never guilt-tripping. Do not ask me questions first: analyse what is there and say what is missing.

# About me
Goal: ${S.set.goal}. Daily targets: ${S.set.cal} kcal and ${S.set.pro} g protein.
${S.set.idNow?'Who I am now: '+S.set.idNow+'\n':''}${S.set.idWant?'Who I want to become: '+S.set.idWant+'\n':''}Tone I prefer: ${TONE[S.set.tone]}.${S.set.custom?'\nMy own instructions: '+S.set.custom:''}
What the app knows about me:
${memText()||'(nothing yet)'}
Habits I am building (atomic-habits style: no streaks, small steps count):
${hab}
${n}
# How to read the data
- My day runs from waking up to the next waking up, not midnight. Each "## Day starting" header is one such day, with screen time and time by tag.
- Lines look like: TIME [kind] description | duration | tag. Kinds: done, meal, study, gym, phone, other, sleep, target, habit.
- [phone] and [study] lines that name an app are real phone usage (study = the YPT study timer app). [sleep] lines are sleep sessions and belong to the day they started.
- [target] lines are my tasks: done, not done (with the reason after "why not"), or open. [habit] lines are habits I completed that day. [gym] lines are exercises with weight, reps and sets, [weight] lines are body-weight check-ins.
- Times are 24-hour. Time with no entry is unlogged: treat it as unknown, not as wasted and not as zero. Each day header also gives the unlogged time, so you can see how complete that day is.
- "nutrition not logged" on a meal means calories are unknown, not zero. "no meals logged" in a day header means unknown, not that I fasted.
- The MESSAGES section at the end is everything I said to Partner (me) and its replies (P) in this period. Use it for context, mood and the reasons I gave.
- Tags are the activity categories I chose (Study, Work, Food, Sleep and so on).

# What I want from you
1) Sleep, wake-up time and morning pattern. 2) Calories and protein versus target. 3) Study, work and gym time, and the real reasons behind skipped tasks. 4) My habits and how I am moving toward the identity I want. 5) The 3 clearest patterns, each with evidence from the data. 6) What went wrong, without blame. 7) ONE or TWO concrete changes for tomorrow. 8) One honest closing sentence.
Finish with a summary of at most 120 words between ===SAVE=== and ===END=== so I can paste it back into my app.

# DIARY (${d===1?'today':'last '+d+' days'})
${data}

# MESSAGES (${d===1?'today':'last '+d+' days'}, every message, me = my words, P = Partner)
${msgText(cut)}`}

 return `<input class="f" id="hf-${d.k}" placeholder="${esc(d.ph||'')}" value="${esc(f[d.k]||'')}">`}
function hSync(){const o=HS;if(!o||!o.f)return;HST.forEach(d=>{if(d.k==='when'){const a=$('#hf-anchor');if(a)o.f.anchor=a.value.trim()}else if(d.chips){const m=$('#hf-mins');if(m)o.f.mins=+m.value||0}else{const e=$('#hf-'+d.k);if(e)o.f[d.k]=e.value.trim()}})}
function drawHabit(){const o=HS;if(!o)return;let b='';
 if(o.mode==='view'){const h=S.habits.find(x=>x.id===o.id);if(!h){closeEdit();return}const lv=hl(h.id,hk()),wk=weekKeys(),n=wk.filter(d=>hl(h.id,d)>0).length,v=votes(h.id);
  b=`<p class="lab" style="margin:0 0 4px">Habit</p><h2 class="hq">${esc(h.name)}</h2>${h.ident?`<p class="hi">I am someone who ${esc(h.ident)}.</p>`:''}<div class="hw" style="margin-top:14px">${wk.map(d=>`<i style="${hl(h.id,d)>1?'background:'+h.c:hl(h.id,d)===1?'background:'+h.c+';opacity:.5':''}"></i>`).join('')}</div><div class="hd">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><small style="display:block;margin-top:8px">${n} day${n===1?'':'s'} this week  ·  ${v} vote${v===1?'':'s'} for your identity</small><div class="hdl">${[['When',whenText(h)],['Where',h.where],['How long',h.mins?h.mins+' min':''],['Why',h.why],['Smallest step',h.step],['Reward',h.reward]].filter(r=>r[1]).map(r=>`<div><small>${r[0]}</small><div>${esc(r[1])}</div></div>`).join('')}</div>${lv<1?`<button class="pb" style="margin-top:18px" data-a="htiny">Do the smallest step</button>`:''}${lv>0?`<button class="pb" style="background:var(--s2);color:var(--tx);margin-top:12px" data-a="hundo">Undo today</button>`:''}<div class="two" style="margin-top:12px"><button class="pb" style="background:var(--s2);color:var(--tx);margin:0" data-a="hedit">Edit</button><button class="pb dl" style="margin:0" data-a="hdel">${o.cd?'Tap again to delete':'Delete'}</button></div>`}
 else if(o.mode==='new'){const d=HST[o.step],last=o.step===HST.length-1;
  b=`<small>Step ${o.step+1} of ${HST.length}</small><div class="hp"><i style="width:${(o.step+1)/HST.length*100}%"></i></div><h2 class="hq">${d.q}</h2><small>${d.h}</small><div style="margin-top:14px">${hField(d,o.f)}</div><small id="eerr" style="display:block;margin-top:8px;color:#e5645f"></small><div class="two" style="margin-top:16px"><button class="pb" style="background:var(--s2);color:var(--tx);margin:0" data-a="${o.step?'hback':'eclose'}">${o.step?'Back':'Cancel'}</button><button class="pb" style="margin:0" data-a="hnext">${last?'Create habit':'Next'}</button></div>`}
 else b=`<p class="lab" style="margin:0 0 4px">Edit habit</p>${HST.map(d=>`<p class="lab" style="margin:16px 0 6px">${d.q}</p>${hField(d,o.f)}`).join('')}<small id="eerr" style="display:block;margin-top:8px;color:#e5645f"></small><div class="two" style="margin-top:16px"><button class="pb" style="background:var(--s2);color:var(--tx);margin:0" data-a="eclose">Cancel</button><button class="pb" style="margin:0" data-a="hsave">Save</button></div>`;
 $('#sheet').innerHTML=`<div class="bd" data-a="eclose"></div><div class="sh">${b}</div>`}
A.hnew=()=>{HS={mode:'new',step:0,f:{mode:'after',anchor:'',mins:5}};drawHabit()};
A.hopen=id=>{HS={mode:'view',id};drawHabit()};
A.hedit=()=>{const h=S.habits.find(x=>x.id===HS.id);if(h){HS={mode:'edit',id:h.id,f:{...h}};drawHabit()}};
A.hmode=m=>{hSync();if((HS.f.mode==='time')!==(m==='time'))HS.f.anchor='';HS.f.mode=m;drawHabit()};
A.hmins=n=>{hSync();HS.f.mins=+n;drawHabit()};
A.hback=()=>{hSync();HS.step--;drawHabit()};
const hFields=f=>({name:f.name,ident:f.ident||'',mode:f.mode,anchor:f.anchor||'',where:f.where||'',mins:+f.mins||0,why:f.why||'',step:f.step||'',reward:f.reward||''});
A.hnext=()=>{hSync();const o=HS,f=o.f;if(o.step===0&&!f.name){$('#eerr').textContent='Give your habit a name.';return}
 if(o.step<HST.length-1){o.step++;drawHabit();return}
 S.habits.push({id:'h'+Date.now(),...hFields(f),c:HC[S.habits.length%HC.length],ts:Date.now()});put('habits');syncN();closeEdit();render();toast('New habit planted. Your first vote is waiting.',0,4200)};
A.hsave=()=>{hSync();const f=HS.f;if(!f.name){$('#eerr').textContent='Give your habit a name.';return}const h=S.habits.find(x=>x.id===HS.id);if(h){Object.assign(h,hFields(f));put('habits');syncN()}closeEdit();render()};
A.hdel=()=>{if(!HS.cd){HS.cd=true;drawHabit();return}S.habits=S.habits.filter(x=>x.id!==HS.id);delete S.hlog[HS.id];put('habits');put('hlog');syncN();closeEdit();render()};
A.htiny=()=>{const id=HS.id;closeEdit();habitDone(id,1)};
A.hundo=()=>{if(S.hlog[HS.id])delete S.hlog[HS.id][hk()];put('hlog');closeEdit();render()};
A.hhint=id=>{if(Date.now()-HJ<900)return;toast(hl(id,hk())>1?'Already done today. Open the habit to undo.':'Press and hold for 3 seconds to complete')};
function burst(x,y,c){const b=document.createElement('div');b.className='burst';b.style.cssText=`left:${x}px;top:${y}px`;for(let i=0;i<14;i++){const a=i/14*6.283,r=42+Math.random()*30,p=document.createElement('i');p.style.cssText=`--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;background:${i%3?c:'#ffd60a'}`;b.appendChild(p)}document.body.appendChild(b);setTimeout(()=>b.remove(),900)}
function habitDone(id,lv,el){const h=S.habits.find(x=>x.id===id);if(!h)return;const k=hk(),m=S.hlog[id]=S.hlog[id]||{};if((m[k]||0)>=lv)return;m[k]=lv;put('hlog');HJ=Date.now();
 const r=el&&el.getBoundingClientRect(),n=votes(id);try{navigator.vibrate&&navigator.vibrate(lv>1?[40,50,90]:30)}catch(e){}
 render();if(r)burst(r.left+r.width/2,r.top+r.height/2,h.c);
 toast(['Nice work.','You showed up.','Small step, real progress.','That counts.'][n%4]+' Vote #'+n+(h.ident?' for being someone who '+h.ident+'.':'.')+(lv>1&&h.reward?' Now enjoy: '+h.reward:''),0,4800)}
let HT=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-hold]');if(!b)return;b.classList.add('holding');try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}HT={b,t:setTimeout(()=>{const id=b.dataset.hold;b.classList.remove('holding');HT=null;habitDone(id,2,b)},3000)}});
const hend=()=>{if(HT){clearTimeout(HT.t);HT.b.classList.remove('holding');HT=null}};
document.addEventListener('pointerup',hend);document.addEventListener('pointercancel',hend);
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-hold]'))e.preventDefault()});
A.vtest=()=>speak('नमस्ते, मैं पार्टनर हूँ। आज की पढ़ाई कैसी चल रही है?');
A.model=k=>{S.set.model=k;put('set');render()};A.effort=k=>{S.set.effort=k;put('set');render()};A.maxtok=k=>{S.set.maxTok=+k;put('set');render()};A.vprov=k=>{S.set.vp=k;put('set');render()};
Object.assign(A,{
 atog:()=>{paS().alarm=!paS().alarm;put('set');render()},
 ctog:async()=>{const p=paS();if(p.cal){p.cal=false;put('set');render();return}if(!PH){warn('Calendar needs the APK.');return}try{const r=await PH.requestCalendar();if(r&&r.granted)p.cal=true;else warn('Calendar permission was not given.')}catch(e){warn('Could not ask for calendar access.')}put('set');render()},
 lkon:()=>lkEdit(c=>{c.on=!c.on;return c}),
 lkprot:()=>lkEdit(c=>{c.protect=!c.protect;return c}),
 lkexit:()=>lkEdit(c=>{c.exit=!c.exit;return c}),
 lkdelay:()=>lkEdit(c=>{c.delay=!c.delay;return c}),
 lkrule:id=>{LKD.ed=id;V='s-rule';render()},
 lkadd:()=>{LKD.q='';V='s-apps';render();loadApps()},
 lkpick:async pkg=>{const ex=lkView().rules.find(r=>r.pkg===pkg);if(ex){LKD.ed=ex.id;V='s-rule';render();return}const id='r'+Date.now();await lkEdit(c=>{c.rules.push({id,pkg,name:LKD.map[pkg]||pkg,min:30,lock:20});c.on=true;return c});LKD.ed=id;V='s-rule';render()},
 lkmins:m=>lkEdit(c=>{const r=c.rules.find(x=>x.id===LKD.ed);if(r)r.min=+m;return c}),
 lklock:m=>lkEdit(c=>{const r=c.rules.find(x=>x.id===LKD.ed);if(r)r.lock=+m;return c}),
 lkdel:async()=>{await lkEdit(c=>{c.rules=c.rules.filter(x=>x.id!==LKD.ed);return c});V='s-lock';render()},
 lkcancel:async()=>{if(LKD.st&&LKD.st.locked){warn('Lockdown is active. Settings are locked until it ends.');return}const l=lkd();l.pend=null;l.pendAt=0;put('set');await lkPush();render()},
 lkacc:async()=>{if(!LK)return;try{await LK.openAccessibility()}catch(e){warn('Could not open accessibility settings: '+((e&&e.message)||e))}},
 lkadmin:async()=>{if(!LK)return;LKD.adminErr='';try{await LK.requestAdmin()}catch(e){LKD.adminErr='Android did not open the screen ('+((e&&e.message)||e)+'). Open Android Settings, Security, Device admin apps, Partner, and activate it.';warn(LKD.adminErr);render()}await lkSync();if(V==='s-lock')render()},
 lkmin:m=>{LKD.min=+m;render()},
 lkstart:async()=>{const mn=LKD.min||30;if(!confirm('Start lockdown for '+mn+' minutes? Only calls will work until it ends.'))return;if(await lkStart(mn,'Lockdown'))render()}
});
Object.assign(A,{suall:()=>{SU.on=true;SU.one=false;SU.tried=new Set();SU.err='';render();suRun()},sustep:k=>{SU.err='';SU.one=true;SU.tried=new Set(SUS.map(y=>y[0]).filter(y=>y!==k));SU.on=true;suRun()},suskip:()=>{S.set.setupDone=true;put('set');SU.on=false;V='diary';maybeGoals();render()}});

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.f;if(!k)return;S.set[k]=t.type==='number'?(+t.value||0):(['key','evKey','evVoice','ggKey','ggVoice'].includes(k)?t.value.trim():t.value);put('set');if(k==='rev'||k==='qs'||k==='qe')syncN()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='in'){e.preventDefault();A.sendt()}if(e.key==='Enter'&&e.target.id==='mn'){e.preventDefault();A.addmem()}});
$('#file').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)importFiles(await Promise.all(fs.map(async f=>({name:f.name,text:await f.text()}))))};
boot();
